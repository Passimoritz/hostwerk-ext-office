name: Check, test & release

# Same rules as the Hostwerk catalog: manifest, security, design and translations (sdk/check.js --strict),
# plus the unit tests of the extension (node --test). A new "version" in manifest.json on main (or a tag v1.2.3)
# builds <id>-<version>.zip with a SHA-256 file as a GitHub release – the Hostwerk catalog picks it up automatically.
# Native extensions (SDK 2.7) ship their built interface module (ui/index.js) – it is rebuilt here and must match.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Hostwerk extension check (the shipped package)
        # The catalog runs sdk/check.js --strict on the unpacked release zip and Hostwerk checks the unpacked package on
        # install – so the check runs on exactly the files the "Build package" step below zips (same filter), not on the
        # whole checkout (ui/src, tests and tools are not shipped and would count against the 10 MB limit).
        run: |
          curl -fsSL https://raw.githubusercontent.com/Passimoritz/hostwerk-public/main/sdk/check.js -o "$RUNNER_TEMP/check.js"
          PKG="$RUNNER_TEMP/pkg"; mkdir -p "$PKG"
          git ls-files -z | grep -zvE '^(\.github/|\.gitignore$|\.gitattributes$|tests/|tools/|scripts/|ui/src/|node_modules/|package(-lock)?\.json$|docs/.*\.md$|ARCHITECTURE\.md$|.*\.todo\.json$)' | xargs -0 cp --parents -t "$PKG"
          node "$RUNNER_TEMP/check.js" "$PKG" --strict
      - name: Interface module and editor chunks build
        # Office: main module plus the lazy editor chunks (ui/assets/*) with the format libraries from package.json.
        # npm ci also provides the test dependencies (unit tests below).
        run: |
          curl -fsSL https://raw.githubusercontent.com/Passimoritz/hostwerk-public/main/sdk/build-native.js -o "$RUNNER_TEMP/build-native.js"
          npm ci --no-audit --no-fund >/dev/null
          HW_BUILD_NATIVE="$RUNNER_TEMP/build-native.js" node tools/build.js
          git diff --quiet -- ui/index.js ui/index.css ui/assets || echo "::warning::ui/ differs from a fresh build – run node tools/build.js before tagging."
          git checkout -- ui/index.js ui/index.css ui/assets ui/src/lib/version.js 2>/dev/null || true
      - name: Unit tests
        if: hashFiles('tests/*.test.js') != ''
        run: node --test tests/*.test.js
      - name: New version?
        id: ver
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # main: a version without a release yet is released right away (no manual tag needed); a tag always builds
          VER=$(node -p "require('./manifest.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$VER" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME does not match manifest version $VER"; exit 1; fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] || ! gh release view "v$VER" >/dev/null 2>&1; then echo "release=v$VER" >> "$GITHUB_OUTPUT"; else echo "v$VER is already released"; fi
      - name: Build package
        if: steps.ver.outputs.release != ''
        env:
          TAG: ${{ steps.ver.outputs.release }}
        run: |
          ID=$(node -p "require('./manifest.json').id")
          VER=$(node -p "require('./manifest.json').version")
          # Everything that belongs to the package (pages, widget, server/, ui/, locales/, lang/, data/, docs/ …) –
          # only the repository tooling stays out (Git, workflows, tests, interface source, installed build tools)
          # Only files of the repository (git ls-files) – leftovers of the test run never end up in the package
          git ls-files -z | grep -zvE '^(\.github/|\.gitignore$|\.gitattributes$|tests/|tools/|scripts/|ui/src/|node_modules/|package(-lock)?\.json$|docs/.*\.md$|ARCHITECTURE\.md$|.*\.todo\.json$)' | xargs -0 zip -X "$ID-$VER.zip"
          sha256sum "$ID-$VER.zip" | cut -d' ' -f1 > "$ID-$VER.zip.sha256"
          echo "Package: $ID-$VER.zip ($(cat "$ID-$VER.zip.sha256"))"
      - name: Publish release
        if: steps.ver.outputs.release != ''
        env:
          TAG: ${{ steps.ver.outputs.release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          awk '/^## /{n++} n==1' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then gh release upload "$TAG" *.zip *.zip.sha256 --clobber
          else gh release create "$TAG" --target "$GITHUB_SHA" *.zip *.zip.sha256 --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"; fi
